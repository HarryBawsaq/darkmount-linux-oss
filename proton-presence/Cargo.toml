[package]
name = "proton-presence"
version = "0.1.0"
edition = "2021"
description = "Discord Rich Presence for Steam games running through Proton"
license = "MIT"
publish = false

# Standalone project: not a member of the repository's root workspace.
[workspace]

[dependencies]
anyhow = "1"
log = { version = "0.4", features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"

[profile.release]
lto = true
strip = true
